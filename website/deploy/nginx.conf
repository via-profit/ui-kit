server {
    listen 80;
    server_name ui-kit.via-profit.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /home/web/ui-kit.via-profit.ru;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://ui-kit.via-profit.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ui-kit.via-profit.ru;

    ssl_certificate /etc/letsencrypt/live/ui-kit.via-profit.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ui-kit.via-profit.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/ui-kit.via-profit.ru.access.log;
    error_log /var/log/nginx/ui-kit.via-profit.ru.error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml text/markdown image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:9046;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
